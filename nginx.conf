server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  # X-Robots-Tag for demo builds (VITE_NOINDEX=1); an empty comment otherwise. The Dockerfile writes this file at build
  # time from the same variable the site was built with (scripts/prerender.mjs -> dist-ssr/robots-header.conf).
  include /etc/nginx/snippets/robots-header.conf;
  # Retired URLs (kept in sync with public/_redirects)
  location = /services/cabinet-signs { return 301 /services/custom-sign-fabrication; }
  location = /services/trimless-letters { return 301 /services/ultra-slim-trimless-channel-letters; }
  location = /services/cast-block-acrylic { return 301 /services/ultra-slim-trimless-channel-letters; }
  location = /gallery { return 301 /projects; }
  # The previous WordPress site's indexed pages (keep their ranking)
  location = /channel-letters { return 301 /services/channel-letters; }
  location = /channel-letters/ { return 301 /services/channel-letters; }
  location = /profile-11-slim-letters { return 301 /services/ultra-slim-trimless-channel-letters; }
  location = /profile-11-slim-letters/ { return 301 /services/ultra-slim-trimless-channel-letters; }
  location = /lightbox-push-through-letters { return 301 /services/custom-sign-fabrication; }
  location = /lightbox-push-through-letters/ { return 301 /services/custom-sign-fabrication; }
  location = /contact-sunlite-signs-llc { return 301 /contact; }
  location = /contact-sunlite-signs-llc/ { return 301 /contact; }
  location = /privacy-policy { return 301 /; }
  location = /privacy-policy/ { return 301 /; }
  # add_header in a location replaces the inherited ones, so the robots header is repeated here.
  location /assets/ { include /etc/nginx/snippets/robots-header.conf; expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/index.html /index.html; }
}
