server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  # Retired URLs (kept in sync with public/_redirects)
  location = /services/cabinet-signs { return 301 /services/channel-letters; }
  location = /services/trimless-letters { return 301 /services/ultra-slim-trimless-channel-letters; }
  location = /gallery { return 301 /projects; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/index.html /index.html; }
}
