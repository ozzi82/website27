server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  # X-Robots-Tag for demo builds (VITE_NOINDEX=1); an empty comment otherwise. The Dockerfile writes this file at build
  # time from the same variable the site was built with (scripts/prerender.mjs -> dist-ssr/robots-header.conf).
  include /etc/nginx/snippets/robots-header.conf;
  # www -> bare domain is done by the proxy in front (Coolify "Direction" setting, or Cloudflare), not here: a redirect in this
  # file loops with a proxy rule that points the other way (ERR_TOO_MANY_REDIRECTS).
  # Retired URLs (kept in sync with public/_redirects). $is_args$args keeps the query string, so an ad click ID (gclid) and
  # the campaign tags survive a redirect from an old address.
  location = /services/cabinet-signs { return 301 /services/custom-sign-fabrication$is_args$args; }
  location = /services/trimless-letters { return 301 /services/ultra-slim-trimless-channel-letters$is_args$args; }
  location = /services/cast-block-acrylic { return 301 /services/ultra-slim-trimless-channel-letters$is_args$args; }
  location = /gallery { return 301 /projects$is_args$args; }
  # The previous WordPress site's indexed pages (keep their ranking)
  location = /channel-letters { return 301 /services/channel-letters$is_args$args; }
  location = /channel-letters/ { return 301 /services/channel-letters$is_args$args; }
  location = /profile-11-slim-letters { return 301 /services/ultra-slim-trimless-channel-letters$is_args$args; }
  location = /profile-11-slim-letters/ { return 301 /services/ultra-slim-trimless-channel-letters$is_args$args; }
  location = /lightbox-push-through-letters { return 301 /services/custom-sign-fabrication$is_args$args; }
  location = /lightbox-push-through-letters/ { return 301 /services/custom-sign-fabrication$is_args$args; }
  location = /contact-sunlite-signs-llc { return 301 /contact$is_args$args; }
  location = /contact-sunlite-signs-llc/ { return 301 /contact$is_args$args; }
  # The old spec brochure PDF (indexed by Google) now lives at /sunlite-signs-spec-guide.pdf
  location = /slsbrochure-16pages_Optimized.pdf { return 301 /sunlite-signs-spec-guide.pdf$is_args$args; }
  location = /edgeluxe-lp-1 { return 301 /light-effects/lp-1-flat-cutout$is_args$args; }
  location = /edgeluxe-lp-1/ { return 301 /light-effects/lp-1-flat-cutout$is_args$args; }
  # add_header in a location replaces the inherited ones, so the robots header is repeated here.
  location /assets/ { include /etc/nginx/snippets/robots-header.conf; expires 1y; add_header Cache-Control "public, immutable"; }
  # Pages of the old WordPress site that must be forgotten (lorem ipsum /service/ pages, WordPress internals): 410 Gone.
  # Note /service/ (old) is different from /services/ (the real product pages).
  location ^~ /service/ { return 410; }
  location ^~ /wp-content/ { return 410; }
  location ^~ /wp-includes/ { return 410; }
  location ^~ /wp-admin/ { return 410; }
  location ~ ^/wp-[^/]*\.php$ { return 410; }
  # Every real page is prerendered, so an unknown address gets a real 404 (not the homepage with a 200).
  error_page 404 410 /404.html;
  location = /404.html { internal; }
  location / { try_files $uri $uri/index.html =404; }
}
